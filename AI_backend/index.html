<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sanjaya AI — Sacred Scriptural Vision</title>
    
    <!-- Retro & Classical Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Minimal Retro Tonal Olive & Clay System -->
    <link rel="stylesheet" href="./theme.css">
</head>
<body>

    <!-- 1. Ambient Background Canvas (Fixed, Non-blocking, Behind Everything) -->
    <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>

    <!-- 2. Main Interface (Instantly Visible & Accessible) -->
    <div id="main-interface">
        
        <!-- Retro Header Bar -->
        <header class="app-header">
            <div class="brand-wrapper">
                <div class="brand-logo-frame">
                    <img src="./sanjaya_logo.jpg" alt="Sanjaya" class="brand-logo-img">
                </div>
                <span class="brand-title">Sanjaya</span>
                <span class="retro-badge">v2.5 AI</span>
            </div>

            <div class="header-controls">
                <button onclick="toggleAudioSpeech()" id="audio-toggle-btn" class="btn-retro" title="Toggle Speech Readout">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>AUDIO</span>
                </button>

                <button onclick="toggleTheme()" id="theme-toggle-btn" class="btn-retro" title="Toggle Light/Dark Theme">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                    <span>THEME</span>
                </button>

                <button onclick="clearChat()" class="btn-retro btn-new-chat" title="Start New Conversation">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>NEW CHAT</span>
                </button>
            </div>
        </header>

        <!-- Main Chat Log -->
        <main class="chat-main-container">
            
            <div id="chat-window">
                
                <!-- Welcome Hero (Initial Empty State) -->
                <div id="welcome-card" class="message-anim">
                    <div class="welcome-emblem">
                        <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Logo">
                    </div>

                    <h1 class="welcome-title">What scriptural wisdom do you seek?</h1>
                    
                    <div class="retro-divider">
                        · · · ॐ · · ·
                    </div>

                    <p class="welcome-subtitle">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>

                    <div class="chips-wrapper">
                        <button onclick="usePreset('Where did Lord Krishna impart the knowledge of Bhagavad Gita?')" 
                                class="suggested-chip">
                            <strong>[ 01 ]</strong> Where was the Bhagavad Gita imparted?
                        </button>
                        <button onclick="usePreset('What is the essence of Karma Yoga in the Gita?')" 
                                class="suggested-chip">
                            <strong>[ 02 ]</strong> What is the essence of Karma Yoga?
                        </button>
                    </div>
                </div>

            </div>

            <!-- Pinned Console Input Bar -->
            <div class="chat-input-bar-container">
                <div class="input-console-wrapper">
                    <span class="input-prompt-label">[ &gt; ]</span>
                    <input type="text" id="user-input" 
                           placeholder="Ask of the Gita, Ramayana, or Mahabharata..." 
                           class="chat-input-field"
                           autocomplete="off"
                           aria-label="Ask Sanjaya a spiritual question"
                           onkeydown="if(event.key === 'Enter') sendMessage()">
                    
                    <button onclick="sendMessage()" 
                            class="btn-send-message"
                            aria-label="Send Query"
                            title="Send Query">
                        <span>SEND</span>
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <div class="footer-scripture-note">
                    Sanjaya AI · Scriptural Wisdom Retrieval Engine
                </div>
            </div>

        </main>

    </div>

    <!-- Background Canvas Ambient Script -->
    <script src="./canvas.js"></script>

    <!-- App Configuration -->
    <script>
        window.SANJAYA_CONFIG = { API_URL: "https://sanjay-d7dl.onrender.com/api/query" };
    </script>

    <!-- Core App Logic -->
    <script>
        const API_URL = (window.SANJAYA_CONFIG && window.SANJAYA_CONFIG.API_URL) 
            || (window.location.protocol === 'file:' 
                ? 'http://localhost:5000/api/query' 
                : '/api/query');
        let autoSpeechEnabled = false;

        // Theme Initialization & Management
        function initTheme() {
            const savedTheme = localStorage.getItem('sanjaya_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            applyTheme(theme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('sanjaya_theme', theme);
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        }

        initTheme();

        function usePreset(queryText) {
            const input = document.getElementById('user-input');
            if (input) {
                input.value = queryText;
                input.focus();
            }
        }

        function toggleAudioSpeech() {
            autoSpeechEnabled = !autoSpeechEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            if (btn) {
                if (autoSpeechEnabled) {
                    btn.classList.add('active');
                    speakText("Voice response enabled.");
                } else {
                    btn.classList.remove('active');
                    window.speechSynthesis.cancel();
                }
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                if (icon) {
                    icon.className = 'fa-solid fa-check';
                    setTimeout(() => {
                        icon.className = 'fa-solid fa-copy';
                    }, 2000);
                }
            });
        }

        function clearChat() {
            const chatWindow = document.getElementById('chat-window');
            if (!chatWindow) return;
            chatWindow.innerHTML = `
                <div id="welcome-card" class="message-anim">
                    <div class="welcome-emblem">
                        <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Logo">
                    </div>
                    <h1 class="welcome-title">What scriptural wisdom do you seek?</h1>
                    <div class="retro-divider">· · · ॐ · · ·</div>
                    <p class="welcome-subtitle">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>
                    <div class="chips-wrapper">
                        <button onclick="usePreset('Where did Lord Krishna impart the knowledge of Bhagavad Gita?')" 
                                class="suggested-chip">
                            <strong>[ 01 ]</strong> Where was the Bhagavad Gita imparted?
                        </button>
                        <button onclick="usePreset('What is the essence of Karma Yoga in the Gita?')" 
                                class="suggested-chip">
                            <strong>[ 02 ]</strong> What is the essence of Karma Yoga?
                        </button>
                    </div>
                </div>
            `;
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            const paragraphs = formatted.split(/\n\s*\n/);
            return paragraphs
                .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        async function typeWriter(element, text, speed = 8) {
            let i = 0;
            element.classList.add('cursor-pen');
            const formattedHTML = formatMarkdown(text);
            
            return new Promise(resolve => {
                function type() {
                    if (i >= formattedHTML.length) {
                        element.classList.remove('cursor-pen');
                        resolve();
                        return;
                    }

                    if (formattedHTML[i] === '<') {
                        let tagEnd = formattedHTML.indexOf('>', i);
                        if (tagEnd !== -1) {
                            element.innerHTML += formattedHTML.substring(i, tagEnd + 1);
                            i = tagEnd + 1;
                            type();
                            return;
                        }
                    }

                    element.innerHTML += formattedHTML.charAt(i);
                    i++;
                    
                    const chatWindow = document.getElementById('chat-window');
                    if (chatWindow) {
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    }

                    setTimeout(type, speed);
                }
                type();
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            if (!input || !chat) return;

            const text = input.value.trim();
            if (!text) return;

            const welcomeCard = document.getElementById('welcome-card');
            if (welcomeCard) welcomeCard.remove();

            // 1. User Message (Retro olive pill)
            chat.innerHTML += `
                <div class="user-msg-container message-anim">
                    <div class="bubble-user">
                        ${text}
                    </div>
                </div>
            `;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // 2. Loading State
            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `
                <div id="${loadingId}" class="loading-indicator-row message-anim">
                    <i class="fa-solid fa-circle-notch spinner-icon"></i>
                    <span>Consulting sacred scriptures...</span>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });
                
                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                const aiText = data.answer || "I could not retrieve scriptural answers at this moment.";
                const msgId = 'msg-' + Date.now();

                // 3. AI Message (Retro Manuscript Panel)
                chat.innerHTML += `
                    <div class="ai-msg-container message-anim">
                        <div class="ai-avatar">
                            <img src="./sanjaya_logo.jpg" alt="Sanjaya">
                        </div>
                        <div class="ai-body-wrapper">
                            <div class="ai-header-meta">
                                <span class="ai-speaker-label">SANJAYA // RECITAL</span>
                                <div class="ai-actions-bar">
                                    <button onclick="copyToClipboard(document.getElementById('${msgId}').innerText, this)" class="btn-msg-tool" title="Copy Answer">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <button onclick="speakText(document.getElementById('${msgId}').innerText)" class="btn-msg-tool" title="Read Aloud">
                                        <i class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="${msgId}" class="response-text"></div>
                        </div>
                    </div>
                `;

                const contentElement = document.getElementById(msgId);
                await typeWriter(contentElement, aiText, 8);

                if (autoSpeechEnabled) {
                    speakText(aiText);
                }

            } catch (e) {
                document.getElementById(loadingId)?.remove();
                chat.innerHTML += `
                    <div class="message-anim" style="display: flex; justify-content: flex-start;">
                        <div class="error-notice-card">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>Connection error with backend server.</span>
                        </div>
                    </div>
                `;
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
