<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sanjaya AI — Sacred Scriptural Vision</title>
    
    <!-- Warm Tonal Google Fonts: Cormorant Garamond (Serif), Plus Jakarta Sans (UI Sans), Noto Serif Devanagari (Sanskrit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+Devanagari:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Monochrome Tonal Design System (Olive #6B7048 & Clay #CF9A6F) -->
    <link rel="stylesheet" href="./theme.css">
</head>
<body>

    <!-- ================= 1. SACRED ORGANIC CANVAS BACKGROUND ================= -->
    <canvas id="bg-canvas" id="bg-canvas-container" aria-hidden="true"></canvas>

    <!-- ================= 2. BRAND LOGO STARTUP ANIMATION ================= -->
    <div id="intro-screen">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 10;">
            <!-- Animated Sacred Tree & Manuscript Logo with Warm Tonal Glow -->
            <div class="logo-container-intro">
                <div class="logo-glow-ring"></div>
                <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Logo" class="logo-img-intro">
            </div>

            <h1 class="intro-title">SANJAYA</h1>
            <p class="intro-subtext">Divine Scriptural Vision AI</p>
        </div>
    </div>

    <!-- ================= 3. MAIN APPLICATION INTERFACE ================= -->
    <div id="main-interface">
        
        <!-- TOP NAVIGATION HEADER -->
        <header class="app-header">
            <div class="brand-wrapper">
                <div class="brand-logo-container">
                    <img src="./sanjaya_logo.jpg" alt="Sanjaya Logo" class="brand-logo-header">
                </div>
                <span class="brand-name">Sanjaya</span>
                <span class="brand-badge">v2.5 AI</span>
            </div>

            <div class="header-actions">
                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="btn-icon-action" title="Toggle Theme" aria-label="Toggle Light and Dark Theme">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>

                <!-- Audio Speech Toggle Button -->
                <button onclick="toggleAudioSpeech()" id="audio-toggle-btn" class="btn-icon-action" title="Toggle Speech Readout" aria-label="Toggle Audio Speech Readout">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <!-- New Chat Button -->
                <button onclick="clearChat()" class="btn-new-chat" title="Start a New Conversation" aria-label="New Chat">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>New Chat</span>
                </button>
            </div>
        </header>

        <!-- CHAT FEED CONTAINER -->
        <main class="chat-main-container">
            
            <div id="chat-window">
                
                <!-- EMPTY CHAT WELCOME HERO -->
                <div id="welcome-card" class="message-anim">
                    <div class="welcome-logo-badge">
                        <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Emblem" class="welcome-logo-img">
                    </div>

                    <h2 class="welcome-title">What scriptural wisdom do you seek?</h2>
                    
                    <!-- Decorative Botanical Leaf-and-Vine Ornament (Single Tone Olive Bezier Curves) -->
                    <div class="ornament-divider" aria-hidden="true">
                        <svg viewBox="0 0 240 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-height: 22px;">
                            <path d="M10 12C35 12 55 6 75 12C95 18 105 12 120 12C135 12 145 18 165 12C185 6 205 12 230 12" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                            <!-- Center Sacred Lotus/Leaf Bud -->
                            <path d="M120 4C123 8 126 10 120 16C114 10 117 8 120 4Z" fill="currentColor"/>
                            <!-- Left Leaf Pairs -->
                            <path d="M75 12C78 8 84 9 82 13C78 13 76 12 75 12Z" fill="currentColor" opacity="0.85"/>
                            <path d="M50 11C47 8 41 9 43 13C47 13 49 12 50 11Z" fill="currentColor" opacity="0.85"/>
                            <!-- Right Leaf Pairs -->
                            <path d="M165 12C162 8 156 9 158 13C162 13 164 12 165 12Z" fill="currentColor" opacity="0.85"/>
                            <path d="M190 11C193 8 199 9 197 13C193 13 191 12 190 11Z" fill="currentColor" opacity="0.85"/>
                            <!-- Branch Finials -->
                            <circle cx="8" cy="12" r="1.5" fill="currentColor"/>
                            <circle cx="232" cy="12" r="1.5" fill="currentColor"/>
                        </svg>
                    </div>

                    <p class="welcome-subtitle">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>

                    <!-- Suggested Question Chips -->
                    <div class="chips-wrapper">
                        <button onclick="usePreset('Where did Lord Krishna impart the knowledge of Bhagavad Gita?')" 
                                class="suggested-chip">
                            Where was the Bhagavad Gita imparted?
                        </button>
                        <button onclick="usePreset('What is the essence of Karma Yoga in the Gita?')" 
                                class="suggested-chip">
                            Essence of Karma Yoga
                        </button>
                    </div>
                </div>

            </div>

            <!-- PINNED BOTTOM INPUT BAR -->
            <div class="chat-input-bar-container">
                <div class="input-pill-wrapper">
                    <input type="text" id="user-input" 
                           placeholder="Message Sanjaya..." 
                           class="chat-input-field"
                           autocomplete="off"
                           aria-label="Ask Sanjaya a spiritual or scriptural question"
                           onkeydown="if(event.key === 'Enter') sendMessage()">
                    
                    <button onclick="sendMessage()" 
                            class="btn-send-message"
                            aria-label="Send Query"
                            title="Send Query">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <div class="footer-scripture-note">
                    Sanjaya AI recites knowledge from ancient sacred scriptures.
                </div>
            </div>

        </main>

    </div>

    <!-- Background Organic Canvas Script -->
    <script src="./canvas.js"></script>

    <!-- App Configuration -->
    <script>
        window.SANJAYA_CONFIG = { API_URL: "https://sanjay-d7dl.onrender.com/api/query" };
    </script>

    <!-- Core App Logic (Functionality Preserved 100%) -->
    <script>
        const API_URL = (window.SANJAYA_CONFIG && window.SANJAYA_CONFIG.API_URL) 
            || (window.location.protocol === 'file:' 
                ? 'http://localhost:5000/api/query' 
                : '/api/query');
        let autoSpeechEnabled = false;

        // Theme Initialization & Management
        function initTheme() {
            const savedTheme = localStorage.getItem('sanjaya_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            applyTheme(theme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('sanjaya_theme', theme);
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        }

        // Initialize Theme immediately to prevent theme flash
        initTheme();

        // Startup animation Sequence (2.0s preserved)
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const mainInterface = document.getElementById('main-interface');

            setTimeout(() => {
                introScreen.style.opacity = '0';
                introScreen.style.transform = 'scale(1.02)';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainInterface.classList.add('active');
                }, 700);
            }, 2000);
        });

        function usePreset(queryText) {
            const input = document.getElementById('user-input');
            input.value = queryText;
            input.focus();
        }

        function toggleAudioSpeech() {
            autoSpeechEnabled = !autoSpeechEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            if (autoSpeechEnabled) {
                btn.classList.add('active');
                speakText("Voice response enabled.");
            } else {
                btn.classList.remove('active');
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                if (icon) {
                    icon.className = 'fa-solid fa-check';
                    setTimeout(() => {
                        icon.className = 'fa-solid fa-copy';
                    }, 2000);
                }
            });
        }

        function clearChat() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = `
                <div id="welcome-card" class="message-anim">
                    <div class="welcome-logo-badge">
                        <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Emblem" class="welcome-logo-img">
                    </div>
                    <h2 class="welcome-title">What scriptural wisdom do you seek?</h2>
                    
                    <div class="ornament-divider" aria-hidden="true">
                        <svg viewBox="0 0 240 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-height: 22px;">
                            <path d="M10 12C35 12 55 6 75 12C95 18 105 12 120 12C135 12 145 18 165 12C185 6 205 12 230 12" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                            <path d="M120 4C123 8 126 10 120 16C114 10 117 8 120 4Z" fill="currentColor"/>
                            <path d="M75 12C78 8 84 9 82 13C78 13 76 12 75 12Z" fill="currentColor" opacity="0.85"/>
                            <path d="M50 11C47 8 41 9 43 13C47 13 49 12 50 11Z" fill="currentColor" opacity="0.85"/>
                            <path d="M165 12C162 8 156 9 158 13C162 13 164 12 165 12Z" fill="currentColor" opacity="0.85"/>
                            <path d="M190 11C193 8 199 9 197 13C193 13 191 12 190 11Z" fill="currentColor" opacity="0.85"/>
                            <circle cx="8" cy="12" r="1.5" fill="currentColor"/>
                            <circle cx="232" cy="12" r="1.5" fill="currentColor"/>
                        </svg>
                    </div>

                    <p class="welcome-subtitle">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>

                    <div class="chips-wrapper">
                        <button onclick="usePreset('Where did Lord Krishna impart the knowledge of Bhagavad Gita?')" 
                                class="suggested-chip">
                            Where was the Bhagavad Gita imparted?
                        </button>
                        <button onclick="usePreset('What is the essence of Karma Yoga in the Gita?')" 
                                class="suggested-chip">
                            Essence of Karma Yoga
                        </button>
                    </div>
                </div>
            `;
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            const paragraphs = formatted.split(/\n\s*\n/);
            return paragraphs
                .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        async function typeWriter(element, text, speed = 8) {
            let i = 0;
            element.classList.add('cursor-pen');
            const formattedHTML = formatMarkdown(text);
            
            return new Promise(resolve => {
                function type() {
                    if (i >= formattedHTML.length) {
                        element.classList.remove('cursor-pen');
                        resolve();
                        return;
                    }

                    if (formattedHTML[i] === '<') {
                        let tagEnd = formattedHTML.indexOf('>', i);
                        if (tagEnd !== -1) {
                            element.innerHTML += formattedHTML.substring(i, tagEnd + 1);
                            i = tagEnd + 1;
                            type();
                            return;
                        }
                    }

                    element.innerHTML += formattedHTML.charAt(i);
                    i++;
                    
                    const chatWindow = document.getElementById('chat-window');
                    chatWindow.scrollTop = chatWindow.scrollHeight;

                    setTimeout(type, speed);
                }
                type();
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const text = input.value.trim();
            
            if (!text) return;

            const welcomeCard = document.getElementById('welcome-card');
            if (welcomeCard) welcomeCard.remove();

            // 1. User Message (Mid-to-Dark Olive Bubble with Warm Light Text)
            chat.innerHTML += `
                <div class="user-msg-container message-anim">
                    <div class="bubble-user">
                        ${text}
                    </div>
                </div>
            `;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // 2. Loading State
            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `
                <div id="${loadingId}" class="loading-indicator-row message-anim">
                    <i class="fa-solid fa-circle-notch spinner-icon"></i>
                    <span>Sanjaya is inspecting sacred scriptures...</span>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });
                
                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                const aiText = data.answer || "I could not retrieve scriptural answers at this moment.";
                const msgId = 'msg-' + Date.now();

                // 3. AI Message (Tonal Parchment / Deep Olive-Night Card)
                chat.innerHTML += `
                    <div class="ai-msg-container message-anim">
                        <div class="ai-avatar">
                            <img src="./sanjaya_logo.jpg" alt="Sanjaya Emblem">
                        </div>
                        <div class="ai-body-wrapper">
                            <div class="ai-header-meta">
                                <span class="ai-speaker-label">Sanjaya</span>
                                <div class="ai-actions-bar">
                                    <button onclick="copyToClipboard(document.getElementById('${msgId}').innerText, this)" class="btn-msg-tool" title="Copy Answer" aria-label="Copy Answer">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <button onclick="speakText(document.getElementById('${msgId}').innerText)" class="btn-msg-tool" title="Read Aloud" aria-label="Read Answer Aloud">
                                        <i class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="${msgId}" class="response-text"></div>
                        </div>
                    </div>
                `;

                const contentElement = document.getElementById(msgId);
                await typeWriter(contentElement, aiText, 8);

                if (autoSpeechEnabled) {
                    speakText(aiText);
                }

            } catch (e) {
                document.getElementById(loadingId)?.remove();
                chat.innerHTML += `
                    <div class="message-anim" style="display: flex; justify-content: flex-start;">
                        <div class="error-notice-card">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>Connection error with backend server.</span>
                        </div>
                    </div>
                `;
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
