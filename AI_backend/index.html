<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjaya AI</title>
    
    <!-- Minimalist Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-main: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* ================= LOGO STARTUP ANIMATION ================= */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-container-intro {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoIntroAnim 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-img-intro {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.6)) contrast(1.15) brightness(1.05);
        }

        .logo-glow-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1.5px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.35), inset 0 0 15px rgba(245, 158, 11, 0.2);
            animation: ringPulse 2.4s ease-in-out infinite alternate;
        }

        @keyframes logoIntroAnim {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-15deg);
                filter: blur(10px);
            }
            65% {
                opacity: 1;
                transform: scale(1.08) rotate(3deg);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0px);
            }
        }

        @keyframes ringPulse {
            0% { transform: scale(0.96); opacity: 0.6; }
            100% { transform: scale(1.06); opacity: 1; }
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.25em;
            opacity: 0;
            transform: translateY(12px);
            animation: textFadeIn 0.8s ease-out 0.6s forwards;
        }

        .intro-subtext {
            letter-spacing: 0.2em;
            opacity: 0;
            transform: translateY(8px);
            animation: textFadeIn 0.8s ease-out 0.9s forwards;
        }

        @keyframes textFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= MAIN INTERFACE ================= */
        #main-interface {
            opacity: 0;
            transition: opacity 0.5s ease-out;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-interface.active {
            opacity: 1;
            pointer-events: auto;
        }

        .message-anim {
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typewriter Cursor */
        .cursor-pen::after {
            content: ' ';
            display: inline-block;
            width: 6px;
            height: 16px;
            background-color: var(--accent-orange);
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .response-text p {
            margin-bottom: 0.85rem;
            line-height: 1.75;
            font-size: 0.95rem;
            color: #e4e4e7;
        }
        .response-text p:last-child {
            margin-bottom: 0;
        }

        .brand-logo-header {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
        }
    </style>
</head>
<body class="antialiased selection:bg-orange-500/30 selection:text-orange-200">

    <!-- ================= 1. BRAND LOGO STARTUP ANIMATION ================= -->
    <div id="intro-screen">
        <div class="flex flex-col items-center gap-5 z-10">
            <!-- Animated Sacred Tree & Book Logo -->
            <div class="logo-container-intro">
                <div class="logo-glow-ring"></div>
                <img src="./sanjaya_logo.jpg" alt="Sanjaya Sacred Logo" class="logo-img-intro">
            </div>

            <div class="text-center">
                <h1 class="intro-title text-3xl font-extrabold tracking-widest text-amber-400 uppercase mb-1">
                    SANJAYA
                </h1>
                <p class="intro-subtext text-xs text-zinc-400 font-medium uppercase">
                    Divine Scriptural Vision AI
                </p>
            </div>
        </div>
    </div>

    <!-- ================= 2. MINIMAL CHAT INTERFACE ================= -->
    <div id="main-interface" class="w-full h-screen">
        
        <!-- MINIMAL TOP HEADER -->
        <header class="w-full px-4 sm:px-8 py-3 border-b border-zinc-800/60 flex items-center justify-between shrink-0 bg-zinc-950/80 backdrop-blur-md">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-zinc-900 border border-amber-500/30 flex items-center justify-center p-0.5 shadow-sm shadow-amber-500/10">
                    <img src="./sanjaya_logo.jpg" alt="Logo" class="brand-logo-header">
                </div>
                <span class="font-['Cinzel'] font-bold text-base text-zinc-100 tracking-wide">Sanjaya</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-amber-400 font-mono">v2.5 AI</span>
            </div>

            <div class="flex items-center gap-1">
                <button onclick="toggleAudioSpeech()" id="audio-toggle-btn" class="p-2 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 transition" title="Toggle Speech Readout">
                    <i class="fa-solid fa-volume-high text-xs"></i>
                </button>
                <button onclick="clearChat()" class="p-2 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 transition flex items-center gap-1.5 text-xs font-medium" title="New Chat">
                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                    <span class="hidden sm:inline">New Chat</span>
                </button>
            </div>
        </header>

        <!-- CHAT FEED CONTAINER -->
        <main class="flex-1 w-full max-w-3xl mx-auto flex flex-col overflow-hidden px-4 sm:px-6">
            
            <div id="chat-window" class="flex-1 overflow-y-auto py-6 space-y-6">
                
                <!-- EMPTY CHAT WELCOME HERO WITH LOGO -->
                <div id="welcome-card" class="h-full flex flex-col items-center justify-center text-center px-4 message-anim">
                    <div class="w-20 h-20 rounded-full bg-zinc-900 border border-amber-500/30 p-2 flex items-center justify-center mb-4 shadow-xl shadow-amber-500/10">
                        <img src="./sanjaya_logo.jpg" alt="Logo" class="w-full h-full object-cover rounded-full mix-blend-screen filter drop-shadow(0 0 10px rgba(245, 158, 11, 0.5))">
                    </div>
                    <h2 class="font-['Cinzel'] text-xl sm:text-2xl font-bold text-zinc-100 mb-2">What scriptural wisdom do you seek?</h2>
                    <p class="text-xs sm:text-sm text-zinc-400 max-w-md mb-6 leading-relaxed">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>

                    <div class="flex flex-wrap justify-center gap-2 max-w-lg text-xs">
                        <button onclick="usePreset('Where did Lord Krishna impart the knowledge of Bhagavad Gita?')" 
                                class="px-3.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition">
                            Where was the Bhagavad Gita imparted?
                        </button>
                        <button onclick="usePreset('What is the essence of Karma Yoga in the Gita?')" 
                                class="px-3.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition">
                            Essence of Karma Yoga
                        </button>
                    </div>
                </div>

            </div>

            <!-- FLOATING INPUT BAR -->
            <div class="py-3 sm:py-4 shrink-0">
                <div class="relative flex items-center bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-2 focus-within:border-zinc-700 focus-within:ring-1 focus-within:ring-zinc-700 transition shadow-lg">
                    <input type="text" id="user-input" 
                           placeholder="Message Sanjaya..." 
                           class="w-full bg-transparent text-sm text-zinc-100 placeholder-zinc-500 outline-none py-1.5"
                           onkeydown="if(event.key === 'Enter') sendMessage()">
                    
                    <button onclick="sendMessage()" 
                            class="p-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold transition shrink-0 ml-2 shadow-sm shadow-amber-500/20">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </div>
                <div class="text-[11px] text-zinc-500 text-center mt-2 font-normal">
                    Sanjaya AI recites knowledge from ancient sacred scriptures.
                </div>
            </div>

        </main>

    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        window.SANJAYA_CONFIG = { API_URL: "https://sanjay-d7dl.onrender.com/api/query" };
    </script>
    <script>
        const API_URL = (window.SANJAYA_CONFIG && window.SANJAYA_CONFIG.API_URL) 
            || (window.location.protocol === 'file:' 
                ? 'http://localhost:5000/api/query' 
                : '/api/query');
        let autoSpeechEnabled = false;

        // Startup animation Sequence (2.0s)
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const mainInterface = document.getElementById('main-interface');

            setTimeout(() => {
                introScreen.style.opacity = '0';
                introScreen.style.transform = 'scale(1.02)';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainInterface.classList.add('active');
                }, 700);
            }, 2000);
        });

        function usePreset(queryText) {
            const input = document.getElementById('user-input');
            input.value = queryText;
            input.focus();
        }

        function toggleAudioSpeech() {
            autoSpeechEnabled = !autoSpeechEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            if (autoSpeechEnabled) {
                btn.classList.add('bg-zinc-800', 'text-amber-400');
                speakText("Voice response enabled.");
            } else {
                btn.classList.remove('bg-zinc-800', 'text-amber-400');
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                icon.className = 'fa-solid fa-check text-emerald-400 text-xs';
                setTimeout(() => {
                    icon.className = 'fa-solid fa-copy text-xs';
                }, 2000);
            });
        }

        function clearChat() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = `
                <div id="welcome-card" class="h-full flex flex-col items-center justify-center text-center px-4 message-anim">
                    <div class="w-20 h-20 rounded-full bg-zinc-900 border border-amber-500/30 p-2 flex items-center justify-center mb-4 shadow-xl shadow-amber-500/10">
                        <img src="./sanjaya_logo.jpg" alt="Logo" class="w-full h-full object-cover rounded-full mix-blend-screen filter drop-shadow(0 0 10px rgba(245, 158, 11, 0.5))">
                    </div>
                    <h2 class="font-['Cinzel'] text-xl sm:text-2xl font-bold text-zinc-100 mb-2">What scriptural wisdom do you seek?</h2>
                    <p class="text-xs sm:text-sm text-zinc-400 max-w-md mb-6 leading-relaxed">
                        Ask any question from the Bhagavad Gita, Ramayana, or Mahabharata.
                    </p>
                </div>
            `;
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-400 font-semibold">$1</strong>');
            const paragraphs = formatted.split(/\n\s*\n/);
            return paragraphs
                .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        async function typeWriter(element, text, speed = 8) {
            let i = 0;
            element.classList.add('cursor-pen');
            const formattedHTML = formatMarkdown(text);
            
            return new Promise(resolve => {
                function type() {
                    if (i >= formattedHTML.length) {
                        element.classList.remove('cursor-pen');
                        resolve();
                        return;
                    }

                    if (formattedHTML[i] === '<') {
                        let tagEnd = formattedHTML.indexOf('>', i);
                        if (tagEnd !== -1) {
                            element.innerHTML += formattedHTML.substring(i, tagEnd + 1);
                            i = tagEnd + 1;
                            type();
                            return;
                        }
                    }

                    element.innerHTML += formattedHTML.charAt(i);
                    i++;
                    
                    const chatWindow = document.getElementById('chat-window');
                    chatWindow.scrollTop = chatWindow.scrollHeight;

                    setTimeout(type, speed);
                }
                type();
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const text = input.value.trim();
            
            if (!text) return;

            const welcomeCard = document.getElementById('welcome-card');
            if (welcomeCard) welcomeCard.remove();

            // 1. User Message
            chat.innerHTML += `
                <div class="flex justify-end message-anim">
                    <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm px-4 py-3 bg-zinc-800 border border-zinc-700/60 text-zinc-100 text-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // 2. Loading State
            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `
                <div id="${loadingId}" class="flex justify-start message-anim">
                    <div class="flex items-center gap-2.5 text-xs text-zinc-400 py-2">
                        <i class="fa-solid fa-circle-notch animate-spin text-amber-500"></i>
                        <span>Sanjaya is inspecting sacred scriptures...</span>
                    </div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });
                
                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                const aiText = data.answer || "I could not retrieve scriptural answers at this moment.";
                const msgId = 'msg-' + Date.now();

                // 3. AI Message with Logo Avatar
                chat.innerHTML += `
                    <div class="flex items-start gap-3 message-anim">
                        <div class="w-7 h-7 rounded-full bg-zinc-900 border border-amber-500/30 p-0.5 shrink-0 mt-1 flex items-center justify-center overflow-hidden">
                            <img src="./sanjaya_logo.jpg" alt="Logo" class="w-full h-full object-cover rounded-full mix-blend-screen filter drop-shadow(0 0 4px rgba(245, 158, 11, 0.6))">
                        </div>
                        <div class="flex-1 space-y-2 overflow-hidden">
                            <div class="flex items-center justify-between text-xs text-zinc-400 pb-1">
                                <span class="font-semibold text-amber-400">Sanjaya</span>
                                <div class="flex items-center gap-1 opacity-80 hover:opacity-100 transition">
                                    <button onclick="copyToClipboard(document.getElementById('${msgId}').innerText, this)" class="p-1 hover:text-zinc-200 transition" title="Copy">
                                        <i class="fa-solid fa-copy text-xs"></i>
                                    </button>
                                    <button onclick="speakText(document.getElementById('${msgId}').innerText)" class="p-1 hover:text-zinc-200 transition" title="Read Aloud">
                                        <i class="fa-solid fa-volume-high text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="${msgId}" class="response-text"></div>
                        </div>
                    </div>
                `;

                const contentElement = document.getElementById(msgId);
                await typeWriter(contentElement, aiText, 8);

                if (autoSpeechEnabled) {
                    speakText(aiText);
                }

            } catch (e) {
                document.getElementById(loadingId)?.remove();
                chat.innerHTML += `
                    <div class="flex justify-start message-anim">
                        <div class="rounded-xl p-3 bg-red-950/40 border border-red-800/40 text-red-300 text-xs flex items-center gap-2">
                            <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
                            <span>Connection error with backend server.</span>
                        </div>
                    </div>
                `;
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
